name = "subtrack-api"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

# Local + deployed bindings. Create the database once with:
#   npx wrangler d1 create subtrack_db
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "subtrack_db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
# Comma-separated list of allowed front-end origins, or "*" for any.
ALLOWED_ORIGIN = "*"
# The single admin account. There is no registration flow.
ADMIN_USERNAME = "admin"

# ADMIN_PASSWORD and AUTH_SECRET are secrets — set them once with:
#   npx wrangler secret put ADMIN_PASSWORD
#   npx wrangler secret put AUTH_SECRET        # openssl rand -hex 32

[observability]
enabled = true

# Daily at 01:00 UTC = 09:00 Asia/Shanghai.
[triggers]
crons = ["0 1 * * *"]
